# Smile Community Centre - production .htaccess additions
# Paste ABOVE the "# BEGIN WordPress" block in public_html/.htaccess (cPanel > File Manager).
# Keep a copy of the old file first. Every block is wrapped in <IfModule> so a missing
# Apache module never causes a 500 error. Test the home page, a form and wp-admin after saving.

# ---------------------------------------------------------------------------
# 1. Security: block files that must never be downloaded
# ---------------------------------------------------------------------------
Options -Indexes

<FilesMatch "^(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|\.user\.ini|php\.ini|error_log|debug\.log)$">
  Require all denied
</FilesMatch>

# Backups, dumps, archives and dotfiles (.git, .env, .htpasswd ...)
<FilesMatch "\.(zip|tar|gz|tgz|rar|7z|sql|bak|old|orig|swp|log|ini|env|sh)$">
  Require all denied
</FilesMatch>
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteRule (^|/)\.(?!well-known/) - [F,L]
</IfModule>

# XML-RPC is switched off in the theme; also stop the requests before PHP runs.
<Files xmlrpc.php>
  Require all denied
</Files>

# ---------------------------------------------------------------------------
# 2. HTTPS everywhere (one hop, also for www)
# ---------------------------------------------------------------------------
<IfModule mod_rewrite.c>
  RewriteCond %{HTTPS} !=on [OR]
  RewriteCond %{HTTP_HOST} ^www\. [NC]
  RewriteCond %{HTTP:X-Forwarded-Proto} !https
  RewriteRule ^ https://smilecommunitycentre.org%{REQUEST_URI} [R=301,L]
</IfModule>

# Static files get the same security headers the theme sends for pages.
<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS
</IfModule>

# ---------------------------------------------------------------------------
# 3. Speed: compression
# ---------------------------------------------------------------------------
<IfModule mod_brotli.c>
  AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml font/ttf application/rss+xml
</IfModule>
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml font/ttf application/rss+xml
</IfModule>

# ---------------------------------------------------------------------------
# 4. Speed: long browser caching for versioned assets
#    (theme CSS/JS carry ?ver=, so a new release is always fetched fresh)
# ---------------------------------------------------------------------------
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresDefault                          "access plus 1 week"
  ExpiresByType text/html                 "access plus 0 seconds"
  ExpiresByType text/css                  "access plus 1 year"
  ExpiresByType application/javascript    "access plus 1 year"
  ExpiresByType image/webp                "access plus 1 year"
  ExpiresByType image/avif                "access plus 1 year"
  ExpiresByType image/jpeg                "access plus 1 year"
  ExpiresByType image/png                 "access plus 1 year"
  ExpiresByType image/svg+xml             "access plus 1 year"
  ExpiresByType image/x-icon              "access plus 1 year"
  ExpiresByType font/woff2                "access plus 1 year"
</IfModule>
<IfModule mod_headers.c>
  <FilesMatch "\.(css|js|webp|avif|jpe?g|png|svg|ico|woff2)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
</IfModule>
