# Save as public_html/wp-content/uploads/.htaccess
# Uploaded files are data, never code: block PHP and other scripts in the uploads folder,
# so a malicious file that slips through an upload can never run.
<FilesMatch "\.(php|php[0-9]|phtml|phar|pl|py|cgi|sh|asp|aspx|jsp)$">
  Require all denied
</FilesMatch>
Options -Indexes -ExecCGI
